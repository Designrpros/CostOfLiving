name: Refresh open price data

on:
  # Eurostat and the World Bank publish once a year; run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Eurostat, World Bank, ECB and Statistics Norway data
        run: python3 scripts/site/fetch_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "CostOfLiving-Bot"
          git config --global user.email "bot@costofliving.no"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes found to commit."
          else
            git commit -m "Refresh open price data"
            git push
          fi
