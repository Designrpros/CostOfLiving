name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/site/requirements.txt ghp-import
      - run: python3 scripts/site/build.py
      # Pages serves the gh-pages branch, as it did for mkdocs gh-deploy: -n adds .nojekyll, -f replaces the branch.
      - run: ghp-import -n -p -f -m "Deploy ${{ github.sha }}" site
